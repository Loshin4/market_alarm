name: Update Market Data

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "무료 API 대기시간을 무시하고 전체 일정을 다시 확인"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install collector packages
        run: pip install -r collector/requirements.txt

      - name: Validate collector
        run: |
          python -m py_compile collector/collect_events.py
          python -m unittest collector/test_collect_events.py -v

      - name: Collect schedules and results
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FORCE_REFRESH: ${{ inputs.force_refresh || 'false' }}
        run: python collector/collect_events.py

      - name: Commit and push changed data
        shell: bash
        run: |
          set -e

          if git diff --quiet -- data; then
            echo "No data changes"
            exit 0
          fi

          git config user.name "market-alarm-bot"
          git config user.email "market-alarm-bot@users.noreply.github.com"
          git add data
          git commit -m "data: automatic market schedule update"

          # 저장소에 새 커밋이 생겼더라도 최신 main을 받아 자동으로 합친 뒤 재시도합니다.
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase failed"
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Market data pushed successfully"
              exit 0
            fi

            sleep $((attempt * 3))
          done

          echo "Push failed after 5 attempts"
          exit 1
