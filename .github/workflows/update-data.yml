name: Update Market Data

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Alpha Vantage 제한 대기시간을 무시하고 다시 확인"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install collector packages
        run: pip install -r collector/requirements.txt

      - name: Validate collector
        run: python -m py_compile collector/collect_events.py

      - name: Collect schedules and results
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FORCE_REFRESH: ${{ inputs.force_refresh || 'false' }}
        run: python collector/collect_events.py

      - name: Commit changed data
        run: |
          if git diff --quiet -- data; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "market-alarm-bot"
          git config user.email "market-alarm-bot@users.noreply.github.com"
          git add data
          git commit -m "data: automatic market schedule update"
          git push
