name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install collector packages
        run: pip install -r collector/requirements.txt

      - name: Validate collector
        run: |
          python -m py_compile collector/collect_events.py
          python -m unittest collector.test_collect_events -v

      - name: Collect schedules and results
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          SEC_USER_AGENT: "MarketAlarm/1.9 market-alarm-bot@users.noreply.github.com"
        run: python collector/collect_events.py

      - name: Show collection summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('data/status.json').read_text(encoding='utf-8'))
          for key in ('krx_marketcap', 'market_indicators', 'dart_schedule', 'kind', 'dart', 'alpha', 'nasdaq', 'us_results'):
              item = status.get('sources', {}).get(key, {})
              print(f"{key}: count={item.get('count', 0)}, ok={item.get('ok')}, message={item.get('message', '')}")
          events = json.loads(Path('data/events.json').read_text(encoding='utf-8')).get('events', [])
          kr_results = [e for e in events if e.get('market') == 'KR' and e.get('status') == 'released' and e.get('category') == 'earnings']
          us_schedules = [e for e in events if e.get('market') == 'US' and e.get('status') == 'scheduled' and e.get('category') == 'earnings']
          us_important = [e for e in us_schedules if int(e.get('importance', 0)) >= 4]
          us_results = [e for e in events if e.get('market') == 'US' and e.get('status') == 'released' and e.get('category') == 'earnings']
          print(f"Korean earnings results saved: {len(kr_results)}")
          print(f"U.S. earnings schedules saved: {len(us_schedules)} (important {len(us_important)})")
          print(f"U.S. earnings results saved: {len(us_results)}")
          PY

      - name: Commit and push changed data
        shell: bash
        run: |
          set -e
          if git diff --quiet -- data; then
            echo "No data changes"
            exit 0
          fi

          git config user.name "market-alarm-bot"
          git config user.email "market-alarm-bot@users.noreply.github.com"
          git add data
          git commit -m "data: automatic market schedule and result update"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
