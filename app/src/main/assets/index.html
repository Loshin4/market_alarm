<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>증시알람</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--red:#ef4444;--orange:#f59e0b;--green:#16a34a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}header{position:sticky;top:0;z-index:10;background:#111827;color:#fff;padding:17px 16px;box-shadow:0 8px 24px #0f172a30}.head{display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:900}.sub{font-size:11px;color:#cbd5e1;margin-top:3px}.gear{border:1px solid #ffffff35;background:#ffffff12;color:white;border-radius:11px;padding:8px 10px;font-size:18px}main{max-width:760px;margin:auto;padding:13px 13px 88px}.status{display:none;padding:10px 12px;border-radius:11px;background:#dbeafe;color:#1e40af;font-size:12px;margin-bottom:10px}.status.bad{background:#fee2e2;color:#991b1b}.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mini,.card{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 16px #0f172a0b}.mini{padding:12px}.count{font-size:25px;font-weight:950}.muted{font-size:11px;color:var(--muted);line-height:1.6}.chips{display:flex;gap:7px;overflow:auto;padding:11px 0}.chip{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:999px;padding:8px 12px;font-weight:800;color:#475569}.chip.active{background:var(--blue);color:white;border-color:var(--blue)}.card{overflow:hidden;margin-bottom:12px}.calhead{display:flex;justify-content:space-between;align-items:center;padding:13px;border-bottom:1px solid var(--line)}.month{font-weight:950;font-size:17px}.nav{border:0;background:#eef2ff;color:#1d4ed8;border-radius:9px;padding:7px 11px;font-size:18px}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr)}.week div{text-align:center;padding:8px 0 4px;font-size:10px;color:var(--muted);font-weight:850}.day{min-height:62px;border-top:1px solid #f1f5f9;border-right:1px solid #f1f5f9;padding:6px 5px}.day:nth-child(7n){border-right:0}.day.other{color:#cbd5e1}.day.sel{background:#eff6ff;outline:2px solid #60a5fa;outline-offset:-2px}.num{font-size:11px;font-weight:900}.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:7px}.dot{width:6px;height:6px;border-radius:50%;background:#94a3b8}.i5{background:var(--red)}.i4{background:var(--orange)}.released{background:var(--green)}.section{padding:13px;font-size:14px;font-weight:950}.event{display:grid;grid-template-columns:45px 1fr auto;gap:9px;padding:12px 13px;border-top:1px solid var(--line)}.time{font-size:11px;font-weight:900;color:#475569}.title{font-size:13px;font-weight:900;line-height:1.4}.meta{font-size:10px;color:var(--muted);margin-top:4px}.badge{font-size:10px;border-radius:999px;padding:4px 6px;background:#f1f5f9;font-weight:900}.b5{background:#fee2e2;color:#b91c1c}.b4{background:#fef3c7;color:#b45309}.br{background:#dcfce7;color:#15803d}.result{white-space:pre-line;background:#f8fafc;border-radius:9px;padding:8px;margin-top:7px;font-size:12px;line-height:1.5}.empty{text-align:center;padding:25px;color:var(--muted);font-size:12px}.refresh{position:fixed;right:17px;bottom:20px;border:0;border-radius:16px;background:var(--blue);color:#fff;padding:13px 16px;font-weight:900;box-shadow:0 9px 24px #2563eb55}.refresh.busy{opacity:.6}.modal{display:none;position:fixed;inset:0;background:#0f172a99;z-index:30;align-items:flex-end}.modal.show{display:flex}.sheet{width:100%;background:white;border-radius:22px 22px 0 0;padding:19px;max-height:90vh;overflow:auto}.sheet h2{margin:0}.help,.note{font-size:11px;line-height:1.6;color:var(--muted)}.note{background:#fff7ed;color:#9a3412;padding:10px;border-radius:10px}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:5px}.field input{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1;border:0;border-radius:11px;padding:12px;font-weight:900}.save{background:var(--blue);color:white}.close{background:#e2e8f0;color:#334155}
</style></head><body>
<header><div class="head"><div><div class="brand">📅 증시알람</div><div class="sub">공식 일정 자동수집 · 결과 알림</div></div><button class="gear" onclick="openSettings()">⚙️</button></div></header>
<main><div id="status" class="status"></div><div class="summary"><div class="mini"><div id="eventCount" class="count">0</div><div class="muted">저장된 일정</div></div><div class="mini"><div id="sourceCounts" class="muted">BLS 0 · BEA 0<br>FOMC 0 · 한국은행 0</div></div></div>
<div class="chips"><button class="chip active" data-f="important">중요 일정</button><button class="chip" data-f="all">전체 일정</button><button class="chip" data-f="results">발표 결과</button><button class="chip" data-f="earnings">기업 실적</button></div>
<section class="card"><div class="calhead"><button class="nav" onclick="moveMonth(-1)">‹</button><div id="monthLabel" class="month"></div><button class="nav" onclick="moveMonth(1)">›</button></div><div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div id="calendar" class="grid"></div></section>
<section class="card"><div id="selectedLabel" class="section">선택한 날짜</div><div id="eventList"></div></section></main>
<button id="refreshBtn" class="refresh" onclick="refreshAll()">↻ 새로고침</button>
<div id="modal" class="modal" onclick="if(event.target===this)closeSettings()"><div class="sheet"><h2>무료 데이터 설정</h2><p class="help">키가 없어도 BLS·BEA·FOMC·한국은행 일정은 작동해. 기업 실적과 결과 비교는 무료 키를 선택적으로 넣으면 된다.</p><div class="field"><label>Alpha Vantage 무료 키</label><input id="alphaKey" placeholder="미국 실적 일정·EPS 결과"></div><div class="field"><label>OpenDART 무료 키</label><input id="dartKey" placeholder="국내 실적·공시 결과 (다음 버전 확대)"></div><div class="field"><label>관심 미국 종목</label><input id="watchlist" placeholder="NVDA,MSFT,GOOGL"></div><div class="field"><label>관심 국내 종목</label><input id="krWatchlist" placeholder="삼성전자,SK하이닉스"></div><p class="note">시장 예상치(컨센서스)는 정부·기업 공식자료에 없기 때문에 Alpha Vantage의 무료 제공 범위에서만 비교한다. 키는 휴대폰 내부에 저장된다.</p><div class="actions"><button class="close" onclick="closeSettings()">닫기</button><button class="save" onclick="saveSettings()">저장</button></div></div></div>
<script>
let events=[],cur=new Date(),selected=key(new Date()),filter='important';cur.setDate(1);const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];function key(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function dt(e){return new Date(Number(e.time||0))}function visible(e){if(filter==='all')return true;if(filter==='results')return e.status==='released';if(filter==='earnings')return String(e.category).includes('earnings');return Number(e.importance)>=4||e.status==='released'}
window.receiveEvents=j=>{try{events=JSON.parse(j||'[]')}catch(e){events=[]}render();busy(false)};window.receiveStatus=(m,ok)=>{let s=$('#status');s.textContent=m;s.className='status'+(ok?'':' bad');s.style.display='block';setTimeout(()=>s.style.display='none',6000);busy(false)};
function init(){try{receiveEvents(MarketApp.getCachedEvents())}catch(e){receiveEvents('[]')}loadSettings();$$('.chip').forEach(b=>b.onclick=()=>{$$('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;render()});if(!events.length)refreshAll()}function render(){stats();calendar();list()}function stats(){let c={bls:0,bea:0,fed:0,bok:0,earn:0};events.forEach(e=>{let s=e.source||'';if(s.includes('BLS'))c.bls++;if(s.includes('BEA'))c.bea++;if(s.includes('연방준비'))c.fed++;if(s.includes('한국은행'))c.bok++;if(String(e.category).includes('earnings'))c.earn++});$('#eventCount').textContent=events.length;$('#sourceCounts').innerHTML=`BLS ${c.bls} · BEA ${c.bea}<br>FOMC ${c.fed} · 한국은행 ${c.bok}<br>기업 실적 ${c.earn}`}
function calendar(){let y=cur.getFullYear(),m=cur.getMonth();$('#monthLabel').textContent=`${y}년 ${m+1}월`;let first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),h='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let k=key(d),es=events.filter(e=>key(dt(e))===k&&visible(e));let dots=es.slice(0,5).map(e=>`<i class="dot ${e.status==='released'?'released':'i'+e.importance}"></i>`).join('');h+=`<div class="day ${d.getMonth()!==m?'other':''} ${k===selected?'sel':''}" onclick="selectDay('${k}')"><div class="num">${d.getDate()}</div><div class="dots">${dots}</div></div>`}$('#calendar').innerHTML=h}function selectDay(k){selected=k;calendar();list()}function moveMonth(n){cur.setMonth(cur.getMonth()+n);cur.setDate(1);selected=key(cur);render()}
function badge(e){if(e.status==='released')return'<span class="badge br">결과</span>';if(e.importance>=5)return'<span class="badge b5">매우 중요</span>';if(e.importance>=4)return'<span class="badge b4">중요</span>';return'<span class="badge">일반</span>'}function esc(v){return String(v||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function list(){let p=selected.split('-');$('#selectedLabel').textContent=`${Number(p[1])}월 ${Number(p[2])}일 일정`;let a=events.filter(e=>key(dt(e))===selected&&visible(e)).sort((x,y)=>x.time-y.time);if(!a.length){$('#eventList').innerHTML='<div class="empty">이 날짜에는 선택한 일정이 없어.</div>';return}$('#eventList').innerHTML=a.map(e=>{let t=dt(e).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}),r=e.summary?`<div class="result">${esc(e.summary)}</div>`:'';return`<div class="event" onclick="openSource('${String(e.sourceUrl||'').replace(/'/g,'')}')"><div class="time">${t}</div><div><div class="title">${esc(e.title)}</div><div class="meta">${esc(e.source)} · 한국시간</div>${r}</div>${badge(e)}</div>`}).join('')}
function refreshAll(){busy(true);try{MarketApp.refreshAll()}catch(e){receiveStatus('앱 연결 오류',false)}}function busy(v){let b=$('#refreshBtn');b.classList.toggle('busy',v);b.textContent=v?'불러오는 중...':'↻ 새로고침'}function openSource(u){if(u)try{MarketApp.openUrl(u)}catch(e){}}function openSettings(){loadSettings();$('#modal').classList.add('show')}function closeSettings(){$('#modal').classList.remove('show')}function loadSettings(){try{let s=JSON.parse(MarketApp.getSettings()||'{}');$('#alphaKey').value=s.alphaKey||'';$('#dartKey').value=s.dartKey||'';$('#watchlist').value=s.watchlist||'NVDA,MSFT,GOOGL,AMZN,META';$('#krWatchlist').value=s.krWatchlist||'삼성전자,SK하이닉스'}catch(e){}}function saveSettings(){let s={alphaKey:$('#alphaKey').value.trim(),dartKey:$('#dartKey').value.trim(),watchlist:$('#watchlist').value.trim(),krWatchlist:$('#krWatchlist').value.trim(),showMinor:false};try{MarketApp.saveSettings(JSON.stringify(s));closeSettings();refreshAll()}catch(e){receiveStatus('설정 저장 실패',false)}}window.addEventListener('load',init);
</script></body></html>
