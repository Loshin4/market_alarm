plugins {
    id 'com.android.application'
}

android {
    namespace 'com.marketalarm.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.marketalarm.app'
        minSdk 26
        targetSdk 35
        versionCode 19
        versionName '1.9.0'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.work:work-runtime:2.11.2"
}
